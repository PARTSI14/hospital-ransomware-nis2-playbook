title: Hospital Ransomware - Data Exfiltration to Cloud Storage with rclone
id: 6c0fc7ff-d33b-4d6d-a21e-02b733dd9b1c
status: experimental
description: |
  Detects rclone, or a renamed copy using typical rclone transfer flags, copying data to a remote.
  Double-extortion groups steal patient data before encryption; rclone to MEGA or other cloud storage
  is a common way to do it. Wizard Spider, one of the five reference actors, is mapped to
  ATT&CK T1567.002 Exfiltration to Cloud Storage. Stolen patient data drives the GDPR Art. 33 decision.
references:
  - https://attack.mitre.org/techniques/T1567/002/
author: Stelios Partsinevelos
date: 2026-11-22
tags:
  - attack.exfiltration
  - attack.t1567.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_name:
    - Image|endswith: '\rclone.exe'
    - OriginalFileName: 'rclone.exe'
    - Description: 'Rsync for cloud storage'
  selection_cli_action:
    CommandLine|contains:
      - ' copy '
      - ' sync '
      - ' move '
  selection_cli_flags:
    CommandLine|contains:
      - '--transfers'
      - '--multi-thread-streams'
      - '--ignore-existing'
      - '--no-check-certificate'
      - '--max-age'
  condition: selection_name or (selection_cli_action and selection_cli_flags)
falsepositives:
  - IT teams that use rclone for sanctioned backups (allow-list host, user and destination)
level: high
