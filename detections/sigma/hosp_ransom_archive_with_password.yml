title: Hospital Ransomware - Password-Protected Archive Created Before Exfiltration
id: 9db02531-7985-4ed7-9aa4-e9bfae17b182
status: experimental
description: |
  Detects 7-Zip or WinRAR creating an archive with a password. Operators compress and encrypt stolen
  files so data-loss tools cannot inspect them on the way out. Used by 3 of the 5 reference actors
  (ATT&CK T1560.001 Archive via Utility).
references:
  - https://attack.mitre.org/techniques/T1560/001/
author: Stelios Partsinevelos
date: 2026-11-22
tags:
  - attack.collection
  - attack.t1560.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_tool:
    Image|endswith:
      - '\7z.exe'
      - '\7za.exe'
      - '\7zr.exe'
      - '\rar.exe'
      - '\winrar.exe'
  selection_add:
    CommandLine|contains: ' a '
  selection_password:
    CommandLine|contains:
      - ' -p'
      - ' -hp'
  condition: all of selection_*
falsepositives:
  - Staff sending encrypted archives as a sanctioned way to share files (baseline users and hosts)
level: medium
